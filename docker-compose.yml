# Kalam Compiler — one-server deployment.
#   cp .env.example .env    # then edit secrets
#   docker compose up -d --build
#   docker compose exec backend python -m app.tools.piston_setup   # once: installs gcc + python into Piston
#
# Only the `web` container is exposed. Student programs run inside Piston,
# which has no route to the internet once packages are installed (see runner/README.md).

name: kalam

services:
  web:
    build: ./frontend
    ports:
      - "${KALAM_HTTP_PORT:-80}:80"
    depends_on: [backend]
    restart: unless-stopped
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run, /tmp]
    networks: [public, internal]

  backend:
    build: ./backend
    env_file: .env
    environment:
      KALAM_ENV: production
      KALAM_DATABASE_URL: postgresql+asyncpg://kalam:${POSTGRES_PASSWORD}@postgres:5432/kalam
      KALAM_REDIS_URL: redis://valkey:6379/0
      KALAM_EXECUTOR: piston
      KALAM_PISTON_URL: http://piston:2000
    volumes:
      - ./backend/config/limits.yaml:/app/config/limits.yaml:ro   # edit limits without rebuilding
    depends_on:
      postgres: { condition: service_healthy }
      valkey: { condition: service_started }
      piston: { condition: service_started }
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [internal]   # no internet access needed

  piston:
    image: ghcr.io/engineer-man/piston:latest
    privileged: true   # required by Piston's own sandbox (isolate + cgroups); see runner/README.md
    environment:
      PISTON_DISABLE_NETWORKING: "true"
      PISTON_RUN_TIMEOUT: "300000"        # wall-clock ms incl. waiting for input; CPU time is limited per run
      PISTON_COMPILE_TIMEOUT: "20000"
      PISTON_OUTPUT_MAX_SIZE: "65536"
      PISTON_MAX_PROCESS_COUNT: "16"
      PISTON_MAX_OPEN_FILES: "64"
      PISTON_MAX_FILE_SIZE: "1048576"
      PISTON_RUN_MEMORY_LIMIT: "134217728"
      PISTON_MAX_CONCURRENT_JOBS: "8"
      PISTON_LOG_LEVEL: WARN
    tmpfs: ["/piston/jobs:exec,uid=1000,gid=1000,mode=711"]
    volumes:
      - piston_packages:/piston/packages
    restart: unless-stopped
    networks: [internal, egress]   # egress is used by piston_setup to download compilers

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: kalam
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: kalam
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kalam"]
      interval: 5s
      retries: 10
    restart: unless-stopped
    networks: [internal]

  valkey:   # open-source (BSD) Redis-compatible server
    image: valkey/valkey:8-alpine
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    restart: unless-stopped
    networks: [internal]

volumes:
  pg_data:
  piston_packages:

networks:
  public:
  internal:
    internal: true
  egress:
