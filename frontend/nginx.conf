map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream kalam_backend {
    server backend:8000;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    access_log off;   # privacy: no IP address logs (errors are still logged)
    client_max_body_size 1m;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/wasm image/svg+xml application/manifest+json;

    include /etc/nginx/snippets/kalam-headers.conf;

    # Hashed build files never change: cache for a year.
    location /assets/ {
        include /etc/nginx/snippets/kalam-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Python runtime (~13 MB, ~4 MB gzipped): cache for 30 days.
    location /pyodide/ {
        include /etc/nginx/snippets/kalam-headers.conf;
        add_header Cache-Control "public, max-age=2592000" always;
        location ~ \.mjs$ {
            include /etc/nginx/snippets/kalam-headers.conf;
            add_header Cache-Control "public, max-age=2592000" always;
            default_type application/javascript;
        }
        try_files $uri =404;
    }

    # In-browser C/C++ compiler (used when no backend is reachable). The big files are
    # pre-compressed *.kgz: serve as-is.
    location /clang/ {
        include /etc/nginx/snippets/kalam-headers.conf;
        add_header Cache-Control "public, max-age=2592000" always;
        types { application/octet-stream kgz; application/wasm wasm; application/javascript js; }
        gzip off;
        try_files $uri =404;
    }

    location = /sw.js {
        include /etc/nginx/snippets/kalam-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location /api/ {
        proxy_pass http://kalam_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;   # programs may wait for a student to type
        proxy_send_timeout 600s;
    }

    location / {
        include /etc/nginx/snippets/kalam-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
